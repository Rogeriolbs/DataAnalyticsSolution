[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataanalyticssolution"
version = "0.1.0"
description = "End-to-End Data Analytics Solution for Retail"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "great-expectations>=0.18.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "pre-commit>=3.7.0",
]
dashboards = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "sqlalchemy>=2.0.0",
]
agents = [
    "anthropic>=0.28.0",
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
include = ["pipelines*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=pipelines --cov-report=term-missing --cov-fail-under=80"
